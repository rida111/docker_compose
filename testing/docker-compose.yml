version: "3.9"

networks:
  easybyte_net:
    driver: bridge

services:

  mysql:
    image: mysql:8.0.45-debian
    container_name: mysql_container

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: admin000pwd

    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-padmin000pwd"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

    networks:
      - easybyte_net


  configserver:
    image: ridasfa1/config-server-ms:1.1
    container_name: configserver_container

    restart: unless-stopped

    ports:
      - "8071:8071"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8071/actuator/health/readiness | grep UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

    networks:
      - easybyte_net

  accounts:
    image: ridasfa1/accounts-ms:1.4
    container_name: accounts-ms
    ports:
      - "9090:9090"

    environment:
      SPRING_APPLICATION_NAME: accounts
      SPRING_PROFILES_ACTIVE: default

      # Config Server
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/

      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/accounts_db
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "admin000pwd"
    networks:
      - easybyte_net

    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_healthy

  cards:
    image: ridasfa1/cards-ms:1.1
    container_name: cards-ms
    ports:
      - "9292:9292"

    environment:
      SPRING_APPLICATION_NAME: cards
      SPRING_PROFILES_ACTIVE: default

      # Config Server
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/

      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cards_db
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "admin000pwd"
    networks:
      - easybyte_net

    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_healthy

  loans:
    image: ridasfa1/loans-ms:1.2
    container_name: loans-ms
    ports:
      - "9191:9191"

    environment:
      SPRING_APPLICATION_NAME: loans
      SPRING_PROFILES_ACTIVE: default

      # Config Server
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/

      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/loans_db
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "admin000pwd"
    networks:
      - easybyte_net

    depends_on:
      mysql:
        condition: service_healthy
      configserver:
        condition: service_healthy

volumes:
  mysql_data: